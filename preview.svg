<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <rect width="600" height="600" fill="#f2f2ee"/>
  <line x1="32" y1="56" x2="568" y2="56" stroke="#111111"/>
  <text x="32" y="38" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#111111">Should I use ML?</text>
  <text x="467" y="38" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#666660">10 QUESTIONS</text>
  <text x="32" y="116" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#111111">10 QUESTIONS</text>
  <circle cx="38" cy="159" r="6" fill="#df4b24"/>
  <text x="155" y="187" font-family="Helvetica,Arial,sans-serif" font-size="52" font-weight="400" fill="#111111">Do you actually</text>
  <text x="155" y="245" font-family="Helvetica,Arial,sans-serif" font-size="52" font-weight="400" fill="#111111">need machine</text>
  <text x="155" y="303" font-family="Helvetica,Arial,sans-serif" font-size="52" font-weight="400" fill="#111111">learning?</text>
  <text x="155" y="377" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#111111">Answer ten questions about your data</text>
  <text x="155" y="406" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#111111">and the problem. A small model estimates</text>
  <text x="155" y="435" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#111111">whether ML is worth trying.</text>
  <text x="155" y="474" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#666660">It is not always yes. That is the point.</text>
  <line x1="32" y1="508" x2="568" y2="508" stroke="#111111"/>
  <text x="32" y="546" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#df4b24">01</text>
  <text x="155" y="546" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#111111">How much historical data do you have?</text>
  <line x1="32" y1="578" x2="568" y2="578" stroke="#c9c9c1"/>
